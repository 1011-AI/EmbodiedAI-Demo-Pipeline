schema_version: "1.0"
freeze_date: "2026-07-30"
# 上游项目注册表：记录我们参考/集成的外部项目、固定 commit 和使用边界。
# 这里不是依赖安装文件；真正拉源码由 scripts/*/prepare_* 或 Make target 完成。
purpose: >
  Pin external projects that influence the demo pipeline architecture, evaluation
  protocol, and future integration work. These pins are reference anchors, not
  vendored dependencies.

sources:
  # 2026 Challenge 的训练数据、闭环 evaluator 和提交协议主参考。
  # 正式运行必须使用 v3.9.1；v3.9.0 的 R1Pro base_qvel 坐标系已过期。
  behavior1k_2026:
    role: primary_closed_loop_evaluation_target
    repository: https://github.com/StanfordVL/BEHAVIOR-1K
    documentation:
      - https://behavior.stanford.edu/challenge/dataset.html
      - https://behavior.stanford.edu/challenge/baselines.html
      - https://behavior.stanford.edu/challenge/evaluation.html
      - https://behavior.stanford.edu/challenge/submission.html
    tag: v3.9.1
    pinned_commit: 26f2c7ef7b9cf96bd0414f81e1e751e493762779
    license: BSD-3-Clause
    referenced_paths:
      - OmniGibson/omnigibson/eval/evaluator.py
      - OmniGibson/omnigibson/eval/utils/eval_utils.py
      - OmniGibson/omnigibson/eval/utils/network_utils.py
      - OmniGibson/omnigibson/eval/utils/score_utils.py
    in_scope:
      - r1pro_observation_and_action_contract
      - websocket_policy_protocol
      - public_test_rollouts
      - challenge_metrics_and_videos
    out_of_scope:
      - vendoring_omnigibson
      - changing_official_metric_semantics
      - treating_offline_action_loss_as_closed_loop_success

  # 1011-AI 的轻量工作区保存 baseline/evaluator 编排，但不承载训练代码。
  behavior_baseline_workspace:
    role: internal_behavior_evaluator_orchestrator
    repository: https://github.com/1011-AI/Behavior
    private: true
    branch: agent/publish-behavior-baselines
    pinned_commit: 6ba56ea4e29af8c2619c7e129864a6795145166d
    license: internal_workspace_on_behavior_upstreams
    in_scope:
      - evaluator_setup_reference
      - policy_server_and_evaluator_process_separation
      - official_result_layout_reference
    out_of_scope:
      - model_training_implementation
      - freezing_behavior1k_at_v3_9_0
      - storing_model_weights_or_challenge_data

  # 官方 π0.5 Behavior adapter 是 state/action 数值语义的 oracle。
  # 本项目的主 π0.5 训练路线仍是 LeRobot/PyTorch，二者 checkpoint 不互通。
  openpi_behavior_reference:
    role: official_pi05_behavior_adapter_reference
    repository: https://github.com/wensi-ai/openpi
    branch: behavior
    pinned_commit: 0cc8e355f7bac0976db1cc3139b1ff0379feea60
    license: Apache-2.0
    referenced_paths:
      - src/openpi/configs/robots/b1k.py
      - src/openpi/policies/b1k_policy.py
      - src/openpi/training/config.py
    in_scope:
      - raw61_to_policy23_projection
      - segmented_action_delta_reference
      - pi05_behavior_protocol_oracle
    out_of_scope:
      - loading_jax_checkpoints_into_lerobot_pytorch
      - becoming_a_third_primary_training_pipeline

  # 后续仿真/评测参考。当前不作为第一阶段训练链路依赖。
  robodojo:
    role: external_simulation_and_evaluation_target
    repository: https://github.com/RoboDojo-Benchmark/RoboDojo
    documentation:
      - https://robodojo-benchmark.com/doc/
      - https://robodojo-benchmark.com/doc/usage/install-and-download/
      - https://robodojo-benchmark.com/doc/usage/quite-evaluation/
    default_branch: main
    pinned_commit: 9b4cc885e8f530ed3ab14a30a312ae70242771c4
    pinned_commit_date_utc: "2026-07-12T15:41:53Z"
    license: MIT
    referenced_paths:
      - README.md
      - env_cfg/
      - scripts/eval_policy.sh
      - scripts/internal/smoke_all_tasks.sh
      - src/eval_client/
      - task/RoboDojo/config/fold_clothes.yml
      - task/RoboDojo/config/fold_clothes_random.yml
      - task/RoboDojo/config/organize_table.yml
      - task/RoboDojo/config/classify_objects.yml
      - task/RoboDojo/tasks/fold_clothes.py
      - task/RoboDojo/tasks/organize_table.py
      - task/RoboDojo/tasks/classify_objects.py
    in_scope:
      - evaluation_dimensions
      - smoke_single_benchmark_summary_flow
      - standard_random_task_pairing
      - external_simulation_evaluation_reference
      - future_nvidia_isaac_sim_acceptance_target
    out_of_scope:
      - running_robo_dojo_on_macos
      - making_robo_dojo_a_core_dependency
      - blocking_m2_m3_on_isaac_installation
      - remote_submission_as_current_requirement

  # LeRobot 是官方生态路线的主参考。
  lerobot:
    role: primary_data_to_inference_pipeline_reference
    repository: https://github.com/huggingface/lerobot
    documentation:
      - https://huggingface.co/docs/lerobot/en/index
      - https://huggingface.co/docs/lerobot/fastwam
      - https://huggingface.co/docs/lerobot/lerobot-dataset-v3
    default_branch: main
    pinned_commit: e40b58a8dfa9e7b86918c374791599d070518d11
    pinned_commit_date_utc: "2026-07-08T11:25:54Z"
    license: Apache-2.0
    referenced_paths:
      - README.md
      - docs/source/installation.mdx
      - docs/source/multi_gpu_training.mdx
      - docs/source/lerobot-dataset-v3.mdx
      - src/lerobot/scripts/lerobot_train.py
      - src/lerobot/configs/train.py
      - examples/training/train_policy.py
    in_scope:
      - primary_dataset_to_policy_to_inference_pipeline
      - trajectory_dataset_format_reference
      - real_lerobot_train_cli
      - lerobot_policy_api_reference
      - fastwam_policy_type_reference
      - gpu_required_training_smoke
      - act_policy_on_pusht_dataset
      - train_log_checkpoint_artifact_flow
    out_of_scope:
      - replacing_core_task_schema
      - cpu_toy_training
      - vendoring_lerobot_code
      - requiring_lerobot_in_core_python_environment

  # FastWAM 是 custom/FastWAM 训练后端和 LeRobot FastWAM policy 的共同参考。
  fastwam:
    role: world_action_model_policy_reference_and_custom_backend_base
    repository: https://github.com/yuantianyuan01/FastWAM
    default_branch: main
    pinned_commit: 45d8e1458921d83f8ad6cf9ce993d371208dabd0
    pinned_commit_date_utc: "2026-04-03T11:39:01Z"
    license: Other
    referenced_paths:
      - README.md
      - configs/model/fastwam.yaml
      - configs/train.yaml
      - scripts/train.py
      - scripts/train_zero1.sh
      - scripts/preprocess_action_dit_backbone.py
      - src/fastwam/
    in_scope:
      - lerobot_native_fastwam_policy_reference
      - world_action_model_training_backend
      - released_checkpoint_finetuning
      - wan22_video_expert_action_expert_recipe
      - libero_robotwin_reference_tasks
    out_of_scope:
      - vendoring_fastwam_code
      - installing_cuda_dependencies_in_core_environment
      - claiming_closed_loop_task_success_from_base_fastwam_alone

  # ImageWAM 是后续 custom 扩展候选，不是当前主线交付。
  imagewam:
    role: image_editing_world_action_model_custom_backend
    repository: https://github.com/yuyangalin/ImageWAM
    project_page: https://zhangwenyao1.github.io/ImageWAM/
    huggingface_collection: https://huggingface.co/collections/yuyangalin/imagewam
    default_branch: main
    pinned_commit: 70bc47147a49652fc3ca62617cab0e0b6b31bc92
    pinned_commit_date_utc: "2026-07-09T15:40:13Z"
    license: MIT
    referenced_paths:
      - README.md
      - scripts/flux2/run_train_flux2_klein_imagewam.sh
      - scripts/flux2/run_eval_flux2_libero.sh
    in_scope:
      - custom_backend_extension_path
      - image_editing_backbone_for_action_prediction
      - flux2_4b_libero_release_checkpoint
      - libero_train_eval_wrapper
      - future_robotwin_extension
    out_of_scope:
      - vendoring_imagewam_code
      - forcing_imagewam_into_lerobot_policy_api_in_m1
      - claiming_libero_or_robotwin_success_rate_without_sim_eval

  # 私有 overlay：把官方 FastWAM 接到 realrobot/LIBERO 训练配置。
  fastwam_realrobot_pipeline:
    role: internal_fastwam_realrobot_overlay
    repository: https://github.com/D-URing/fastwam-realrobot-pipeline.git
    private: true
    default_branch: main
    pinned_commit: 5b9791f7d49956b96e0694786f46ff94e8214eca
    pinned_commit_date_utc: "2026-07-13T14:32:21Z"
    license: internal_overlay_on_fastwam_upstream
    referenced_paths:
      - ABOUT_THIS_REPO.md
      - REAL_ROBOT_TRAINING.md
      - WORLD_FAST_CODEBOOK.md
      - configs/train.yaml
      - configs/model/fastwam.yaml
      - configs/task/real_robot_joint_2cam224_1e-4.yaml
      - configs/task/real_robot_uncond_2cam224_1e-4.yaml
      - configs/task/real_robot_joint_2cam224_v6_decision.yaml
      - scripts/train_zero1.sh
      - scripts/train_real_robot_8gpu.sh
      - scripts/train_v6_multinode.sh
      - scripts/offline_fastwam_smoke.py
      - scripts/offline_action_check.py
      - src/fastwam/trainer.py
      - src/fastwam/runtime.py
      - src/fastwam/datasets/lerobot/
    in_scope:
      - custom_backend_extension_path
      - future_self_built_model_development_path
      - private_overlay_workflow
      - realrobot_lerobot_v3_data_loading
      - seven_d_joint_and_ten_d_pose_training_configs
      - fastwam_loss_checkpoint_artifact_flow
      - world_fast_codebook_optional_extension
      - nvidia_cluster_smoke_pilot_full_modes
    out_of_scope:
      - copying_private_overlay_code_into_this_repo
      - storing_weights_datasets_or_runs
      - treating_one_step_smoke_as_loss_convergence
      - bypassing_robot_safety_for_realrobot_eval
