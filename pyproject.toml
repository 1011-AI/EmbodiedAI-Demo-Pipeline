[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai-demo-pipeline"
version = "0.1.0"
description = "LeRobot and custom WAM training/inference pipeline base"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EmbodiedAI Demo Pipeline Contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
behavior1k = [
  "av>=15,<17",
  "msgpack>=1,<2",
  # OpenPI-Comet/JAX 0.5.3 is pinned to NumPy 1.x.  Keep the shared B1K
  # adapter compatible with the actual image instead of letting this extra
  # silently upgrade NumPy and break the Comet backend.
  "numpy>=1.26,<2.0",
  "pyarrow>=18,<26",
  "websockets>=13,<17",
]

[project.scripts]
embodied-demo = "embodied_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
