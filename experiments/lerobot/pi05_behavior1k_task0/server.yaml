# BEHAVIOR-1K 2026 Task 0 的真实 LeRobot / PyTorch π0.5 policy server。
#
# 这个入口加载真实 checkpoint、真实 PI0.5 processor 和 action chunk；
# 不含 mock policy。无 GPU 时只能执行 --dry-run：
#   python pipelines/lerobot/behavior1k/serve.py \
#     --config experiments/lerobot/pi05_behavior1k_task0/server.yaml \
#     --dry-run
#
# GPU 上启动：
#   python pipelines/lerobot/behavior1k/serve.py \
#     --config experiments/lerobot/pi05_behavior1k_task0/server.yaml
#
# evaluator 侧先检查：
#   curl --fail http://POLICY_HOST:8000/healthz

schema_version: "1.0"
backend: lerobot_pi05

paths:
  # behavior1k-prepare-view 生成的 Task 0 视图；其中包含 episode 清单和
  # 23D state/action q01/q99。GPU 挂载前缀不同时设置 BEHAVIOR1K_DATA_ROOT。
  view_dir: data/behavior1k/views/r1pro_policy23/turning_on_radio
  view_stats:

  # LeRobot / PyTorch checkpoint。训练产物可以指向 checkpoints/<step>/pretrained_model。
  # 不能填写 OpenPI / JAX checkpoint。
  checkpoint: models/lerobot/pi05/pi05_base

server:
  host: 0.0.0.0
  port: 8000

  # 模型一次输出完整 chunk；server 每次只向 evaluator 返回一个 float32[23]。
  # 执行 16 步后丢弃剩余 chunk 并基于最新 observation 重规划。
  execution_horizon: 16

policy:
  device: cuda
  # 扩散去噪步数；null 使用 checkpoint / LeRobot 默认值。
  num_inference_steps: 10

runtime:
  # server 与训练/离线推理共用项目内 Hugging Face cache。GPU 节点默认
  # 禁止联网，缺少 tokenizer/config 时立即失败，不会尝试访问 Hub。
  hf_home: hf_cache
  offline: true

  # 与训练入口一致，直接把 PI0.5 参数和 safetensors 落到 CUDA，避免
  # LeRobot 0.6.1 的 CPU 双份峰值撞上容器 cgroup 内存限制。
  direct_cuda_load: true

observation:
  # 必须与 evaluator 使用的 robot YAML 完全一致。官方 v3.9.1 r1pro.yaml
  # 的 flatten_obs_dict 会生成：
  #   robot_r1::proprio
  #   robot_r1::robot_r1:<camera>::rgb
  robot_name: robot_r1
  camera_sensors:
    head: robot_r1:zed_link:Camera:0
    left_wrist: robot_r1:left_realsense_link:Camera:0
    right_wrist: robot_r1:right_realsense_link:Camera:0

dependencies:
  # 通过 editable install 使用固定 checkout；本项目不 vendor LeRobot。
  lerobot:
    checkout: upstreams/lerobot
    version: 0.6.1
    commit: e40b58a8dfa9e7b86918c374791599d070518d11
    require_clean_checkout: true

  # 这两个仓库只固定传输协议来源，不是 server 的运行时依赖。
  protocol_references:
    behavior_repo: https://github.com/StanfordVL/BEHAVIOR-1K.git
    behavior_v3_9_1_commit: 26f2c7ef7b9cf96bd0414f81e1e751e493762779
    openpi_repo: https://github.com/wensi-ai/openpi.git
    openpi_commit: 0cc8e355f7bac0976db1cc3139b1ff0379feea60
