# BEHAVIOR-1K Task 0 的 LeRobot / PyTorch π0.5 真实后训练与离线推理配置。
#
# 先生成零拷贝视图和 23D stats，再检查命令：
#   python experiments/lerobot/pi05_behavior1k_task0/run.py --dry-run
#
# 启动真实训练：
#   python experiments/lerobot/pi05_behavior1k_task0/run.py
#
# 使用 checkpoint 做真实离线推理：
#   python experiments/lerobot/pi05_behavior1k_task0/run.py --mode infer

schema_version: "1.0"
backend: lerobot

experiment:
  name: pi05_behavior1k_task0
  # 留空时每次运行自动生成时间戳；需要稳定续跑时显式填写。
  run_id:

paths:
  # `embodied-demo behavior1k-prepare-view` 的输出。只包含 manifest 与 stats，
  # 不复制 3 TB 原始视频/Parquet。
  view_dir: data/behavior1k/views/r1pro_policy23/turning_on_radio

  # LeRobot/PyTorch π0.5 权重。不能填写 OpenPI/JAX checkpoint。
  pretrained_path: models/lerobot/pi05/pi05_base

  # 训练和推理产物均落到项目 runs/ 下，不写原始数据目录。
  run_root: runs/experiments/lerobot/pi05_behavior1k_task0

dataset:
  repo_id: behavior-1k/2026-challenge-demos
  video_backend: pyav
  eval_split: 0.0

policy:
  type: pi05
  repo_id: local/pi05_behavior1k_task0
  device: cuda
  dtype: bfloat16

  # Behavior/OpenPI 参考 action horizon 为 32。
  chunk_size: 32
  n_action_steps: 32

  # R1Pro action 混合了 base velocity、绝对关节位置和 gripper command。
  # 第一版严禁对全部 23D 隐式做 relative action。
  use_relative_actions: false

  # 短探针关闭 compile，避免首次编译时间掩盖真实数据/模型错误。
  compile_model: false
  gradient_checkpointing: true
  # 当前 16 GB cgroup 下采用 action expert 后训练；PaliGemma VLM 冻结但仍参与
  # 前向，训练的是真实 π0.5 action expert，不是 mock。
  train_expert_only: true
  push_to_hub: false

training:
  # 默认是可观察 loss 的最短真实后训练探针。one-batch overfit 时可把 view
  # 收窄到一个 episode，并将 steps 提高到 20-100。
  steps: 2
  batch_size: 1
  # 当前容器与其他任务共享 16 GB cgroup。worker=0 避免四个视频 worker 在
  # checkpoint 阶段占用数 GB RSS；大内存独占实例可改回 4-8。
  num_workers: 0
  prefetch_factor: 2
  persistent_workers: true
  log_freq: 1

  save_checkpoint: true
  save_freq: 2
  seed: 1005
  wandb: false

distributed:
  # auto 优先读取平台 NPROC_PER_NODE，其次读取 CUDA_VISIBLE_DEVICES / torch。
  # 因此同一配置可在单卡、4 卡或 8 卡节点直接运行；仍可用 run.py
  # 的 --num-processes 做一次性显式覆盖。
  num_processes: auto
  mixed_precision: bf16

  # 当前入口同时支持平台向每个节点注入这些参数。单机无需修改。
  num_machines: 1
  machine_rank: 0
  main_process_ip: 127.0.0.1
  main_process_port: 29505

inference:
  # 默认可直接用 base 做链路检查。训练后改为：
  # runs/.../lerobot_output/checkpoints/<step>/pretrained_model
  checkpoint: models/lerobot/pi05/pi05_base
  sample_index: 0
  num_inference_steps: 10

runtime:
  offline: true
  hf_home: hf_cache
  nccl_debug: WARN

  # LeRobot 0.6.1 默认先在 CPU 构造模型并把 14 GB safetensors 读到 CPU，
  # 容器内存限制较小时会在使用 GPU 前被 OOM kill。开启后，模型参数和权重
  # 直接落到 Accelerate 为当前 rank 选择的 CUDA device；不修改上游源码。
  direct_cuda_load: true

  # 只保存 train_expert_only 的真实可训练参数，并在推理时叠加到固定 base。
  # 这是可推理 checkpoint，不包含 optimizer/RNG，不能用于断点续训。
  delta_checkpoint: true
